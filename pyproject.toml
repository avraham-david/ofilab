[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ofilab-core"
version = "0.1.0"
description = "Empirical psychometric reasoning, normative scoring, and epistemic safety evaluation framework for frontier LLMs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "ofiLab Research Team", email = "research@ofilab.avrahamd.ovh" }
]
keywords = [
    "psychometrics",
    "ipip-neo",
    "big-five",
    "ai-safety",
    "epistemic-robustness",
    "llm-evaluation",
    "inference-net",
    "deepseek"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[project.urls]
Homepage = "https://ofilab.avrahamd.ovh"
Repository = "https://github.com/avraham-d/ofilab-core"
Documentation = "https://ofilab.avrahamd.ovh"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
